<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dire's Deck Builder</title>
</head>

<body class="section"></body>
     <div id="deckList" style="
        position: absolute;
        top: 0;
        left: 0;
        width: 250px;
        height: 100%;
        background-color: #333;
        padding: 10px;
        overflow-y: auto;
    ">
        <h3>Decks</h3>
        <ul id="deckListItems" style="list-style: none; padding: 0;"></ul>
    </div>

        <!-- Main content area -->
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding-top: 50px;">
            <h1>Welcome to Dire's Deckbuilder</h1>

            <form id="createDeckForm" action="/newdeck/" method="POST" onsubmit="event.preventDefault(); createDeck();">
                <input type="text" name="deckname" placeholder="Enter new deck name" id="nameBox">
                <div id="formatButtons">
                    <button type="button" class="format-btn" data-format="Commander">Commander</button>
                    <button type="button" class="format-btn" data-format="Standard">Standard</button>
                </div>
                <input type="hidden" name="format" id="formatInput" value="">
                <button type="submit">Create Deck</button>
            </form>
        </div>
    </div>
    <style>
        :root {
            --primary: hsl(235, 86%, 65%);
            --primary-light: hsl(235, 88%, 73%);
            --dark: #121212;
            --light: #E4E4E4;
            --grey: #424242;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        .section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: top;
        }

        textarea {
            width: 300px;
            height: 100px;
            margin-bottom: 10px;
        }

        button {
            background-color: darkred;
            color: var(--light);
            border: none;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            transition-duration: 0.4s;
        }

        button:hover {
            background-color: white;
            color: red;
        }

        .format-btn{
            min-width: 140px;
            text-align: center;
            margin: 0;
        }

        .format-btn.selected {
            background-color: white;
            color:red
        }

        #createDeckForm {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* space between each row */
        }

        #formatButtons{
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        #nameBox {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            text-align: center;
        }

        #decklist{
            margin-right: 20px;
        }

        #deckListItems li {
        color: var(--light); /* ensures text is visible on dark background */
        padding: 5px 10px;
        border-radius: 4px;
        transition: background-color 0.2s;
        }   

        #deckListItems li:hover {
            background-color: var(--grey); /* subtle hover effect */
        }
        
    </style>
    <script>
        function createDeck() {
            const form = document.getElementById('createDeckForm');
            const formData = new FormData(form);
            const deckName = formData.get('deckname');
            const format = formData.get('format');

            if (!format) {
                alert('Please select a format (Commander, Standard) before creating the deck.');
                return;
            }

            const urlEncodedData = new URLSearchParams(formData).toString();

            fetch('/newdeck/', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok){
                    console.error('Error creating deck:', response.statusText);
                }
                return response.text();
            })
            .then(data => {
                console.log('Deck creation successful:', data);
            })
            .then(data => {
                console.log('Deck creation successful:', data);
                loadDecks(); // <-- Refresh the deck list
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            })
            console.log("Attempting to create deck with name:", deckName, "and format", format);
        }
    
    const formatButtons = document.querySelectorAll('.format-btn');
    const formatInput = document.getElementById('formatInput');

    formatButtons.forEach(button => {
        button.addEventListener('click', () => {
            // Remove 'selected' class from all buttons
            formatButtons.forEach(btn => btn.classList.remove('selected'));
            // Add 'selected' to the clicked one
            button.classList.add('selected');
            // Update hidden input
            formatInput.value = button.getAttribute('data-format');
        });
    });

    function loadDecks() {
    fetch('/listdecks/')
        .then(response => response.json())
        .then(data => {
            const deckList = document.getElementById('deckListItems');
            deckList.innerHTML = ''; // Clear old list

            
            console.log("Deck list received from server:", data); // ← This will show you what it's trying to render

            data.forEach(deck => {
                const li = document.createElement('li');
                li.textContent = deck;
                li.style.cursor = 'pointer';
                li.style.margin = '5px 0';
                li.addEventListener('click', () => {
                    console.log(`Deck clicked: ${deck}`);
                    // You can later redirect or load the deck editor here
                });
                deckList.appendChild(li);
            });
        })
        .catch(err => console.error('Error loading decks:', err));
        
}

window.onload = function () {
    loadDecks();
}

    
    
    </script>
</body>
</html>
