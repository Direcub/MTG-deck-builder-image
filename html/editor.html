<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Deck Editor</title>
</head>

<body>
    <h1 id="deckTitel">Editing: ...</h1>
    <p id="deckForma">Format: ...</p>

    <div style="display: flex; height: 100vh;">
        <div id="cardList" style="width: 250px; background-color: #333; color: white; padding: 10px; overflow-y: auto;">
            <h3>Deck Cards</h3>
            <ul id="cardListItems" style="list-style: none; padding: 0;"></ul>
        </div>

        <div style="flex-grow: 1; text-align: center; padding: 20px;">
            <input type="text" id="cardSearchInput" placeholder="Search for cards..." />
            <button onclick="searchCards()">Search</button>

            <div id="searchResults" style="margin-top: 20px;"></div>
        </div>

        <div id="commanderPanel" style="width: 250px; background-color: #222; color: white; padding: 10px; overflow-y: auto;">
            <h3>Search Results</h3>
            <ul id="searchResultsList" style="list-style: none; padding: 0;"></ul>
        </div>
    </div>
</body>

<script>
    const params = new URLSearchParams(window.location.search)
    const deckName = params.get("deck")
    console.log("Editing deck:", deckName);

    function loadDeck() {
        const params = new URLSearchParams(window.location.search);
        const deckName = params.get("deck");

        if (!deckName) {
            alert("No deck selected.");
            return;
        }

        fetch(`/getdeck?deck=${encodeURIComponent(deckName)}`)
            .then(res => res.text())
            .then(text => {
            const lines = text.split('\n');
            const formatLine = lines.find(line => line.startsWith("# format: "));
            const format = formatLine ? formatLine.replace("# format: ", "").trim() : "Unknown";

            document.getElementById("deckFormat").textContent = `Format: ${format}`;
            
            if (format === "Commander") {
                enableCommanderMode();
            }

            // Later: parse and display the rest of the deck
        })
        .catch(err => console.error("Failed to load deck:", err));
}

    function searchCards() {
        const query = document.getElementById("cardSearchInput").value;
        if (!query) return;

        fetch(`/searchcards?query=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(cards => {
                const list = document.getElementById("searchResultsList");
                list.innerHTML = '';

                cards.forEach(card => {
                    const li = document.createElement("li");
                    li.textContent = card.name;
                    li.style.cursor = "pointer";
                    li.onclick = () => addCardToDeck(card.name);
                    list.appendChild(li);
                });
            })
            .catch(err => console.error("Search failed:", err));
    }
</script>


</html>
